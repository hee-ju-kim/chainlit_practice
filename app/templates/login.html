<!DOCTYPE html>
<html>
<body>
<h2>Login</h2>
<input type="text" id="id" placeholder="username" />
<input type="password" id="password" placeholder="password" />
<button onclick="login()">Login</button>
<span id="error" style="display: block; color: red;"></span>

<script>
  function login () {
    const id = document.getElementById('id').value
    const password = document.getElementById('password').value

    fetch("/user/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({id, password}),
    })
    .then(res => {
      return res.json()
    }).then(result => {
      if (result.result === 'ok') {
        window.location.href = '/chainlit'
      }

      if (result.error) {
        document.getElementById("error").innerHTML = result.error
      }
    }).catch(err => {
      console.log(err)
    })
  }
</script>
</body>
</html>
